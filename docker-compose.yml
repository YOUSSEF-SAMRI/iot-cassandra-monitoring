services:
  cassandra1:
    image: cassandra:5.0
    container_name: cassandra1
    hostname: cassandra1
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: MyCassabdraCluster
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra1_data:/var/lib/cassandra
    networks:
      - cassandra_net

  cassandra2:
    image: cassandra:5.0
    container_name: cassandra2
    hostname: cassandra2
    ports:
      - "9043:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: MyCassabdraCluster
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra2_data:/var/lib/cassandra
    networks:
      - cassandra_net
    depends_on:
      - cassandra1

  cassandra3:
    image: cassandra:5.0
    container_name: cassandra3
    hostname: cassandra3
    ports:
      - "9044:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: MyCassabdraCluster
      CASSANDRA_SEEDS: cassandra1
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      CASSANDRA_NUM_TOKENS: 16
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra3_data:/var/lib/cassandra
    networks:
      - cassandra_net
    depends_on:
      - cassandra1

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: iot_simulator
    depends_on:
      - cassandra1
    networks:
      - cassandra_net
    restart: unless-stopped


volumes:
  cassandra1_data:
  cassandra2_data:
  cassandra3_data:

networks:
  cassandra_net:
    driver: bridge